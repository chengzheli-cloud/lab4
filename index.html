<!DOCTYPE html>
<html lang="en">
<head>
    <title>Getting Held At Gunpoint</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border-left: 5px solid #d9534f;
        }
        h2 {
            margin-top: 0;
            color: #ff6b6b;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 80px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s, border-color 0.2s;
        }
        button:hover {
            background-color: #444;
            border-color: #777;
        }
        #restart-btn {
            background-color: #d9534f;
            border-color: #d9534f;
            display: none;
            margin-top: 15px;
        }
        #restart-btn:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>The Dark Alleyway</h2>
        <p id="story-text">A shadowy figure steps out from the dark, pressing a blade directly against your throat. "Don't make a sound," he whispers. What is your next move?</p>
        
        <div class="btn-group" id="action-buttons">
            <button onclick="makeChoice('gun')">Go for his knife</button>
            <button onclick="makeChoice('run')">Break free and run away</button>
            <button onclick="makeChoice('beg')">Beg for your life, snatch his knife, and turn the tables</button>
        </div>

        <button id="restart-btn" onclick="resetGame()">Try Again</button>
    </div>

    <script>
        // State variable to track user choice
        let playerAction = "";
        let isGameOver = false;

        function makeChoice(action) {
            // Store user choice into the variable
            playerAction = action;
            isGameOver = true;

            let resultText = "";
            let buttonContainer = document.getElementById("action-buttons");
            let restartButton = document.getElementById("restart-btn");

            // Conditional logic (if / else if / else statement structure)
            if (playerAction === "gun") {
                resultText = "You lunge quickly for the firearm at his waist. You are too slow—he reacts instantly, driving the blade deep into your chest. You stumble backward and bleed to death on the cold pavement.";
            } 
            else if (playerAction === "run") {
                resultText = "You shove him hard and sprint blindly into the night. You hear heavy footsteps pounding right behind you. You manage to reach your street, but he chases you all the way there, corners you at your front door, and breaks in.";
            } 
            else if (playerAction === "beg") {
                resultText = "You drop to your knees, sobbing and pleading for mercy. As he lowers his guard to mock you, you explode upward, snatch the knife from his hand, and disarm him. You turn the tables and successfully rob him blind.";
            } 
            else {
                resultText = "Invalid action sequence detected.";
                isGameOver = false;
            }

            // Update the DOM dynamically using innerHTML based on the evaluated state
            document.getElementById("story-text").innerHTML = resultText;

            // Hide choice buttons and reveal restart option
            buttonContainer.style.display = "none";
            restartButton.style.display = "block";
        }

        function resetGame() {
            playerAction = "";
            isGameOver = false;

            document.getElementById("story-text").innerHTML = "A shadowy figure steps out from the dark, pressing a cold steel blade directly against your throat. \"Don't make a sound,\" he whispers. What is your next move?";
            document.getElementById("action-buttons").style.display = "flex";
            document.getElementById("restart-btn").style.display = "none";
        }
    </script>

</body>
</html>
